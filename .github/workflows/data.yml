name: Run data pipeline and deploy assets

on:
  push:
    branches:
      - main
  schedule:
    # post session, run at 45 min after the hour since action is much lower
    - cron: '45 12-23,0-5 * * *'
    # During session, every 20 minutes from 12:00 to 05:59 UTC
    # - cron: '*/20 12-23,0-5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Restore Python dependencies cache
    - name: Restore Python dependencies cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-cache-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-cache-

    # Set up Python
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    # Install dependencies from requirements.txt
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Set up Node.js for JS data processing
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    # Install Node.js dependencies
    - name: Install Node.js dependencies
      run: npm install

    # Configure AWS credentials for S3 asset deployment
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    # Ensure the script is executable
    - name: Make execute.sh executable
      run: chmod +x ./execute.sh ./deploy-assets.sh

    # Execute the shell script
    - name: Run the shell script
      run: ./execute.sh

    # Save Python dependencies cache
    - name: Save Python dependencies cache
      if: always()
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-cache-${{ hashFiles('requirements.txt') }}

    - name: Commit and push if changed
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Latest data: ${timestamp}" || exit 0
        git push
